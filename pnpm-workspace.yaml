packages:
  - 'apps/*'
  - 'packages/*'

# Native/compiled packages allowed to run install scripts (pnpm blocks these by
# default). better-sqlite3 builds a native binding; esbuild fetches a binary.
allowBuilds:
  better-sqlite3: true
  esbuild: true

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.102.8'
  - '@tanstack/react-query@5.102.8'
  - '@vitejs/plugin-react@6.1.1'
